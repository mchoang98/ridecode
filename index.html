<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs</title>

  <!-- TailwindCSS CDN with dark mode class strategy -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          typography: {
            DEFAULT: {
              css: {
                maxWidth: 'none',
                code: {
                  backgroundColor: '#1e1e2e',
                  padding: '0.2em 0.4em',
                  borderRadius: '0.375rem',
                  fontWeight: '400',
                },
                'pre code': {
                  backgroundColor: 'transparent',
                  padding: '0',
                },
              },
            },
          },
        },
      },
    };
  </script>

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />

  <!-- Marked.js — Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Mermaid.js — Diagram rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
    });
    // Switch mermaid theme with dark mode
    (function () {
      const isDark =
        localStorage.getItem('docs-theme') === 'dark' ||
        (!localStorage.getItem('docs-theme') &&
          window.matchMedia('(prefers-color-scheme: dark)').matches);
      mermaid.initialize({
        startOnLoad: false,
        theme: isDark ? 'dark' : 'default',
        securityLevel: 'loose',
      });
    })();
  </script>

  <!-- Fuse.js — Fuzzy search -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7/dist/fuse.min.js"></script>

  <!-- App styles -->
  <style>
    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
    }

    /* Markdown content styles */
    #prose-content {
      line-height: 1.75;
      color: #1f2937;
    }
    .dark #prose-content {
      color: #e5e7eb;
    }
    #prose-content h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 1.5rem 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #e5e7eb;
    }
    .dark #prose-content h1 {
      border-bottom-color: #374151;
    }
    #prose-content h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1.25rem 0 0.75rem;
    }
    #prose-content h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem;
    }
    #prose-content h4 {
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0.75rem 0 0.5rem;
    }
    #prose-content p {
      margin-bottom: 1rem;
    }
    #prose-content a {
      color: #3b82f6;
      text-decoration: underline;
    }
    .dark #prose-content a {
      color: #60a5fa;
    }
    #prose-content ul,
    #prose-content ol {
      margin-bottom: 1rem;
      padding-left: 1.5rem;
    }
    #prose-content ul {
      list-style: disc;
    }
    #prose-content ol {
      list-style: decimal;
    }
    #prose-content li {
      margin-bottom: 0.25rem;
    }
    #prose-content pre {
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 1rem;
      border-radius: 0.5rem;
      overflow-x: auto;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      line-height: 1.7;
    }
    #prose-content code {
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.875em;
    }
    #prose-content :not(pre) > code {
      background: #f3f4f6;
      color: #dc2626;
      padding: 0.15em 0.4em;
      border-radius: 0.3em;
    }
    .dark #prose-content :not(pre) > code {
      background: #374151;
      color: #f87171;
    }
    #prose-content blockquote {
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #6b7280;
      font-style: italic;
    }
    .dark #prose-content blockquote {
      color: #9ca3af;
    }
    #prose-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 1rem;
    }
    #prose-content table th,
    #prose-content table td {
      border: 1px solid #e5e7eb;
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    .dark #prose-content table th,
    .dark #prose-content table td {
      border-color: #374151;
    }
    #prose-content table th {
      background: #f9fafb;
      font-weight: 600;
    }
    .dark #prose-content table th {
      background: #1f2937;
    }
    #prose-content img {
      max-width: 100%;
      border-radius: 0.5rem;
      margin: 1rem 0;
    }
    #prose-content hr {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 1.5rem 0;
    }
    .dark #prose-content hr {
      border-top-color: #374151;
    }

    /* TOC */
    .toc ul {
      list-style: none;
      padding-left: 0;
    }
    .toc li {
      margin-bottom: 0.25rem;
    }
    .toc ul ul {
      padding-left: 1rem;
    }
    .toc-link {
      display: block;
      padding: 0.25rem 0.5rem;
      font-size: 0.8rem;
      color: #6b7280;
      border-left: 2px solid transparent;
      transition: all 0.15s;
      text-decoration: none;
    }
    .dark .toc-link {
      color: #9ca3af;
    }
    .toc-link:hover {
      color: #3b82f6;
    }
    .toc-active {
      color: #3b82f6 !important;
      border-left-color: #3b82f6;
      font-weight: 500;
    }
    .dark .toc-active {
      color: #60a5fa !important;
    }

    /* Search highlight */
    .search-highlight {
      background: #fde68a;
      color: #78350f;
      padding: 0.05em 0.2em;
      border-radius: 0.2em;
    }
    .dark .search-highlight {
      background: #854d0e;
      color: #fef3c7;
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top: 3px solid #3b82f6;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Smooth transitions */
    .sidebar-lesson {
      transition: background-color 0.15s, color 0.15s;
    }

    /* Mobile sidebar transition */
    #sidebar {
      transition: transform 0.3s ease;
    }

    /* Line clamp for search results */
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Mermaid diagram container */
    .mermaid {
      display: flex;
      justify-content: center;
      margin: 1rem 0;
    }
  </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 overflow-hidden">

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden fixed inset-0 z-50 items-center justify-center bg-white dark:bg-gray-900">
    <div class="flex flex-col items-center gap-3">
      <div class="spinner"></div>
      <span class="text-sm text-gray-500 dark:text-gray-400">Loading docs...</span>
    </div>
  </div>

  <!-- Mobile overlay -->
  <div id="overlay" class="hidden fixed inset-0 z-30 bg-black/50 lg:hidden"></div>

  <div class="flex h-screen">
    <!-- ==================== SIDEBAR ==================== -->
    <aside
      id="sidebar"
      class="fixed lg:static inset-y-0 left-0 z-40 w-72 -translate-x-full lg:translate-x-0 flex flex-col bg-gray-50 dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700"
    >
      <!-- Logo / Header -->
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-200 dark:border-gray-700">
        <h1 class="text-lg font-bold text-gray-800 dark:text-white flex items-center gap-2">
          <i class="fa fa-book text-blue-500"></i>
          <span>Docs</span>
        </h1>
        <div class="flex items-center gap-2">
          <button
            id="theme-toggle"
            class="p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
            title="Toggle theme"
          >
            <i class="fa fa-moon-o"></i>
          </button>
          <button
            id="mobile-menu-btn"
            class="lg:hidden p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
          >
            <i class="fa fa-times"></i>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="relative px-3 py-2">
        <div class="relative">
          <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
          <input
            id="search-input"
            type="text"
            placeholder="Search docs..."
            class="w-full pl-9 pr-3 py-2 text-sm rounded-md bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent placeholder-gray-400 dark:placeholder-gray-500"
            autocomplete="off"
          />
        </div>
        <!-- Search results dropdown -->
        <div
          id="search-results"
          class="hidden absolute left-3 right-3 top-full mt-1 max-h-80 overflow-y-auto bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-md shadow-lg z-50"
        ></div>
      </div>

      <!-- Navigation -->
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto px-2 py-2">
        <!-- Populated dynamically -->
      </nav>

      <!-- Footer -->
      <div class="px-3 py-2 border-t border-gray-200 dark:border-gray-700 text-xs text-gray-400 dark:text-gray-500 text-center">
        Powered by GitHub
      </div>
    </aside>

    <!-- ==================== MAIN AREA ==================== -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Top bar -->
      <header class="flex items-center gap-3 px-4 py-2 border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800">
        <!-- Mobile hamburger -->
        <button
          id="mobile-menu-btn-left"
          class="lg:hidden p-2 rounded-md hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors"
          onclick="document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('overlay').classList.toggle('hidden');"
        >
          <i class="fa fa-bars"></i>
        </button>

        <!-- Breadcrumb -->
        <nav id="breadcrumb" class="flex items-center text-sm overflow-x-auto whitespace-nowrap flex-1">
          <span class="text-gray-400 dark:text-gray-500">Select a lesson</span>
        </nav>
      </header>

      <!-- Content + TOC wrapper -->
      <div class="flex flex-1 overflow-hidden">
        <!-- Main content -->
        <main
          id="content"
          class="flex-1 overflow-y-auto px-4 sm:px-6 lg:px-8 py-6"
        >
          <!-- Welcome state (replaced when lesson loads) -->
          <div class="flex flex-col items-center justify-center h-full text-center">
            <i class="fa fa-book text-6xl text-gray-200 dark:text-gray-700 mb-6"></i>
            <h2 class="text-2xl font-semibold text-gray-400 dark:text-gray-500 mb-2">Welcome to the Docs</h2>
            <p class="text-gray-400 dark:text-gray-600 max-w-md">
              Select a lesson from the sidebar to get started.
            </p>
          </div>
        </main>

        <!-- Table of Contents (right panel, hidden on mobile) -->
        <aside
          id="toc-container"
          class="hidden xl:block w-56 border-l border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 overflow-y-auto p-4"
        >
          <h3 class="text-xs font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-3">
            On this page
          </h3>
          <!-- TOC populated dynamically -->
        </aside>
      </div>
    </div>
  </div>

  <!-- ==================== SCRIPTS ==================== -->
  <!-- Config (must load first) -->
  <script src="config.js"></script>
  <!-- App modules -->
  <script src="api.js"></script>
  <script src="renderer.js"></script>
  <script src="search.js"></script>
  <script src="ui.js"></script>
  <script src="main.js"></script>
</body>
</html>
